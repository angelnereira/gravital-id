[package]
name = "gravital-id-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Abstracciones y backend criptográfico (ES256, SHA-256, HMAC, XChaCha20-Poly1305, HPKE) para Gravital ID."

[lints]
workspace = true

[dependencies]
gravital-id-types = { workspace = true }
gravital-id-codec = { workspace = true }
# Primitivas RustCrypto (ADR-0007), todas sin features por defecto para
# preservar no_std + alloc (ADR-0019, REQ-PORT-002).
# Versiones fijadas por MSRV 1.85.0 (ADR-0014): la rama 0.11/0.13/0.14 de
# RustCrypto exige rustc >= 1.87/1.88. La subida será deliberada, con el job
# MSRV de CI en verde.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"] }
ecdsa = { version = "0.16", default-features = false, features = ["der"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
gravital-id-testkit = { path = "../gravital-id-testkit", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "crypto_primitives"
harness = false
