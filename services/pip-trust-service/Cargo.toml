gravital-id-ledger = { workspace = true }
gravital-id-trust = { workspace = true }
gravital-id-crypto = { workspace = true }
gravital-id-types = { workspace = true }
gravital-id-codec = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
gravital-id-testkit = { path = "../../crates/gravital-id-testkit", version = "0.1.0" }
