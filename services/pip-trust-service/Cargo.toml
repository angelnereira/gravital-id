[package]
name = "pip-trust-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Servicio de derivación determinista de trust bundles, cofirma multi-operador k-de-n y publicación de confianza para Gravital ID."

[lints]
workspace = true

[dependencies]
pip-service-common = { path = "../pip-service-common", version = "0.1.0" }
