[package]
name = "pip-service-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Módulo común para servicios backend de Gravital ID: configuración, telemetría OpenTelemetry, salud y redacción no-PII (REQ-OBS-001, REQ-PRIV-003)."

[lints]
workspace = true

[dependencies]
gravital-id-types = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.10"

[dev-dependencies]
gravital-id-testkit = { path = "../../crates/gravital-id-testkit", version = "0.1.0" }
