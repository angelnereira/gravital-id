name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Pruebas (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --workspace --no-fail-fast

  doc:
    name: Documentación (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  xtask:
    name: xtask (capas, trazabilidad, códigos de error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: check-layers (INV-01, INV-09, ADR-0019)
        run: cargo xtask check-layers
      - name: trace (REQ-DOC-003)
        run: cargo xtask trace
      - name: check-error-codes (REQ-SDK-003)
        run: cargo xtask check-error-codes
      - name: La matriz de trazabilidad commiteada está actualizada
        run: git diff --exit-code docs/TRACEABILITY.md

  msrv:
    name: MSRV (ADR-0014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El toolchain fijado coincide con el rust-version del workspace
        run: |
          pinned=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          declared=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)
          echo "rust-toolchain.toml=$pinned Cargo.toml=$declared"
          test "$pinned" = "$declared"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --lib --locked

  feature-powerset:
    name: Matriz de features acotada (cargo hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Acotado: cada feature de forma individual (no el producto cartesiano).
      - run: cargo hack check --workspace --each-feature --all-targets --locked

  cross-compile:
    name: Compilación cruzada (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasm32-unknown-unknown
            target: wasm32-unknown-unknown
            packages: ""
          - name: aarch64-linux-android
            target: aarch64-linux-android
            packages: ""
          - name: aarch64-apple-ios
            target: aarch64-apple-ios
            packages: ""
          # Bare-metal: solo los crates no_std L1-L3 (ADR-0019).
          - name: thumbv7em-none-eabihf (L1-L3)
            target: thumbv7em-none-eabihf
            packages: >-
              -p gravital-id-types -p gravital-id-codec -p gravital-id-crypto
              -p gravital-id-keys -p gravital-id-credential -p gravital-id-status
              -p gravital-id-trust -p gravital-id-verifier -p gravital-id-holder
              -p gravital-id-issuer -p gravital-id-storage -p gravital-id-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build de librerías para ${{ matrix.target }}
        run: cargo build --lib ${{ matrix.packages }} --target ${{ matrix.target }} --locked
